<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantry</title><style>
*{box-sizing:border-box}body{margin:0;font:17px/1.6 Georgia,'Times New Roman',serif;color:#1d1d1f;background:#fbfaf7}
body{font-family:system-ui,sans-serif;padding-bottom:80px}
.top{padding:20px}.top h1{margin:0 0 12px;font-size:28px}
input{width:100%;padding:14px 16px;border:1px solid #ccc;border-radius:12px;font-size:16px}
.cards{display:grid;gap:16px;padding:0 20px}.card{border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card .img{height:140px;background:#f0d9b5}.card p{margin:0;padding:12px 14px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;height:44px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center}
nav a{display:block;width:18px;height:18px;border-radius:4px;background:#333}
</style></head><body>
<div class="top"><h1>What is cooking?</h1><input placeholder="Search recipes"></div>
<div class="cards"><div class="card"><div class="img"></div><p>Charred leek tart</p></div><div class="card"><div class="img" style="background:#d8e6c3"></div><p>Green shakshuka</p></div><div class="card"><div class="img" style="background:#f3c9b8"></div><p>Rhubarb crumble</p></div></div>
<nav><a href="#" aria-label="Home"></a><a href="#" aria-label="Search"></a><a href="#" aria-label="Saved"></a><a href="#" aria-label="Profile"></a></nav>
</body></html>
