<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title><style>
*{box-sizing:border-box}body{margin:0;font:17px/1.6 Georgia,'Times New Roman',serif;color:#1d1d1f;background:#fbfaf7}
body{background:#fff;font-family:system-ui,sans-serif}
#stage{width:660px;height:260px;margin:20px auto;display:grid;place-items:center}
.btn{background:#1f6feb;color:#fff;font:600 18px system-ui;padding:16px 30px;border-radius:10px;animation:pulse 1300ms ease-in-out infinite alternate;box-shadow:0 2px 8px rgba(31,111,235,.25)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.045)}}
</style></head><body>
<div id="stage"><div class="btn">Start free trial</div></div>
</body></html>
