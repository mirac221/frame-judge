<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader</title><style>
*{box-sizing:border-box}body{margin:0;font:17px/1.6 Georgia,'Times New Roman',serif;color:#1d1d1f;background:#fbfaf7}
body{background:#111;font-family:system-ui,sans-serif}
#stage{position:relative;width:660px;height:200px;margin:20px auto}
.dot{position:absolute;top:84px;left:40px;width:32px;height:32px;border-radius:50%;background:#4fd1c5;animation:go 1200ms ease-in-out infinite alternate}
@keyframes go{0%{transform:translateX(0)}49%{transform:translateX(200px)}50%{transform:translateX(420px)}100%{transform:translateX(540px)}}
</style></head><body>
<div id="stage"><div class="dot"></div></div>
</body></html>
