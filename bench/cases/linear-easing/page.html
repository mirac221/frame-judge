<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide-in</title><style>
*{box-sizing:border-box}body{margin:0;font:17px/1.6 Georgia,'Times New Roman',serif;color:#1d1d1f;background:#fbfaf7}
body{background:#eef0f3;font-family:system-ui,sans-serif}
#stage{position:relative;width:860px;height:360px;margin:20px auto;overflow:hidden}
.card{position:absolute;top:130px;left:40px;width:320px;padding:18px 20px;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);animation:in 900ms linear both}
@keyframes in{from{transform:translateX(-420px)}to{transform:translateX(0)}}
</style></head><body>
<div id="stage"><div class="card"><b>New message</b><br>Maya: are we still on for Friday?</div></div>
</body></html>
